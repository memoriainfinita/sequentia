<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequentia</title>
  <!-- Google Fonts: IBM Plex Mono (400,500), IBM Plex Sans (400,500,600), Inter, Playfair Display, Montserrat, Oswald, Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;700&family=Oswald:wght@400;500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens ──────────────────────────────────────────── */
    :root {
      --bg:      #09090b;
      --s1:      #111113;
      --s2:      #18181b;
      --s3:      #27272a;
      --border:  #2e2e32;
      --text:    #fafafa;
      --muted:   #71717a;
      --accent:  #f97316;
      --accent2: #fb923c;
      --green:   #22c55e;
      --red:     #ef4444;
      --mono:    'IBM Plex Mono', monospace;
      --sans:    'IBM Plex Sans', system-ui, sans-serif;
    }

    /* ── Reset ──────────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: grid;
      grid-template-rows: 52px 1fr;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      font-family: var(--sans);
      color: var(--text);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .header-center {
      display: flex;
      align-items: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn-export {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
      transition: background 0.15s;
    }

    .btn-export:hover {
      background: var(--accent2);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--sans);
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* ── Toggle ──────────────────────────────────────────────────── */
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
    }

    .toggle input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ── Indicator ───────────────────────────────────────────────── */
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* ── Layout ──────────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: 100%;
      overflow: hidden;
    }

    #panelCenter {
      background: var(--bg);
    }

    #panelRight {
      background: var(--s2);
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    #panelCenter::-webkit-scrollbar,
    #panelRight::-webkit-scrollbar {
      width: 4px;
    }

    #panelCenter::-webkit-scrollbar-track,
    #panelRight::-webkit-scrollbar-track {
      background: transparent;
    }

    #panelCenter::-webkit-scrollbar-thumb,
    #panelRight::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    #panelCenter::-webkit-scrollbar-thumb:hover,
    #panelRight::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ── Toast System ────────────────────────────────────────────── */
    #toastContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--sans);
      color: var(--text);
      background: var(--s3);
      border: 1px solid var(--border);
      max-width: 320px;
      pointer-events: auto;
      animation: toastIn 0.2s ease forwards;
    }

    .toast.toast-out {
      animation: toastOut 0.2s ease forwards;
    }

    .toast-success {
      border-color: var(--green);
      background: color-mix(in srgb, var(--green) 12%, var(--s3));
    }

    .toast-error {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, var(--s3));
    }

    .toast-info {
      border-color: var(--border);
      background: var(--s3);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }

    /* Thumbnail panel */
    #panelRight { display: flex; flex-direction: column; }
    #thumbList { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    #emptyState { display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 12px; padding: 40px 16px; color: var(--muted); text-align: center; font-size: 13px; }
    .panel-footer { padding: 10px 8px; border-top: 1px solid var(--border); }
    #btnAddImages { width: 100%; padding: 8px; background: var(--s3); color: var(--text);
                    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px;
                    font-family: var(--sans); }
    #btnAddImages:hover { background: var(--accent); border-color: var(--accent); }

    /* Thumbnails */
    :root { --canvas-ratio: 16/9; }
    .thumb { position: relative; width: 100%; aspect-ratio: var(--canvas-ratio);
             border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer;
             background: var(--s3); }
    .thumb:hover { border-color: var(--border); }
    .thumb.selected { border-color: var(--accent); }
    .thumb.drag-over { border-color: var(--accent2); opacity: 0.6; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-num { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.6);
                 color: var(--text); font-size: 11px; font-family: var(--mono);
                 padding: 2px 5px; border-radius: 3px; line-height: 1; }
    .thumb-delete { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6);
                    color: var(--text); border: none; border-radius: 3px; width: 20px; height: 20px;
                    cursor: pointer; font-size: 14px; line-height: 1; display: none; }
    .thumb:hover .thumb-delete { display: flex; align-items: center; justify-content: center; }
    .thumb-badge { position: absolute; bottom: 4px; right: 4px; background: var(--red);
                   color: white; font-size: 10px; font-family: var(--mono); padding: 1px 4px;
                   border-radius: 3px; font-weight: 700; }

    /* Panel central */
    #panelCenter { display: flex; flex-direction: column; overflow: hidden; }
    #previewArea { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; flex-shrink: 0; }
    #previewWrap { position: relative; background: #000; border-radius: 8px; overflow: hidden;
                   display: flex; align-items: center; justify-content: center; }
    #previewCanvas { display: block; }
    #canvasEmpty { position: absolute; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 12px; color: var(--muted); font-size: 14px; inset: 0; }
    #canvasInfo { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.5);
                  color: var(--muted); font-size: 11px; font-family: var(--mono);
                  padding: 3px 6px; border-radius: 3px; pointer-events: none; }
    #configPanels { flex: 1; overflow-y: auto; padding: 0 16px 16px; }

    /* ── Play Controls ───────────────────────────────────────────── */
    #playControls {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0;
      flex-wrap: wrap;
    }
    #playControls button {
      background: var(--s3); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px;
      line-height: 1; transition: background 0.15s;
    }
    #playControls button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
    #playControls button:disabled { opacity: 0.35; cursor: not-allowed; }
    #slideCounter { font-size: 12px; color: var(--muted); margin-left: 4px; }

    /* ── Indicator Live ──────────────────────────────────────────── */
    .indicator.live { background: var(--green); animation: pulse 1.5s infinite; }
    .indicator.recording { background: var(--accent); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Context menu */
    #contextMenu { position: fixed; background: var(--s2); border: 1px solid var(--border);
                   border-radius: 6px; padding: 4px; z-index: 1000; min-width: 160px; }
    #contextMenu button { display: block; width: 100%; padding: 8px 12px; background: none;
                          border: none; color: var(--text); font-size: 13px; font-family: var(--sans);
                          text-align: left; cursor: pointer; border-radius: 4px; }
    #contextMenu button:hover { background: var(--s3); }
  </style>
</head>
<body>

  <header id="header">
    <div class="logo">
      <span class="logo-dot"></span>
      Sequentia
    </div>
    <div class="header-center">
      <button id="btnExport" class="btn-export">Exportar Video</button>
    </div>
    <div class="header-right">
      <span id="indicator" class="indicator"></span>
      <label class="toggle"><input type="checkbox" id="chkLoop"> Loop</label>
      <button id="btnExportJSON" class="btn-ghost">Export JSON</button>
      <button id="btnImportJSON" class="btn-ghost">Import JSON</button>
    </div>
  </header>

  <div id="app">
    <div id="panelCenter">
      <div id="previewArea">
        <div id="previewWrap">
          <canvas id="previewCanvas"></canvas>
          <div id="canvasEmpty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>Carga imágenes para comenzar</p>
          </div>
          <div id="canvasInfo"><!-- se actualiza con ratio y resolución --></div>
        </div>
        <div id="playControls">
          <button id="btnPrev" title="Anterior (←)">⏮</button>
          <button id="btnPlayPause" title="Play/Pause (Espacio)">▶</button>
          <button id="btnNext" title="Siguiente (→)">⏭</button>
          <button id="btnFullscreen" title="Pantalla completa (F)">⛶</button>
          <label class="toggle" title="Loop (L)">
            <input type="checkbox" id="chkLoopCtrl"> Loop
          </label>
          <span id="slideCounter" class="mono">– / –</span>
        </div>
      </div>
      <div id="configPanels"><!-- Task 7 --></div>
    </div>
    <div id="panelRight">
      <div id="thumbList">
        <div id="emptyState">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>Arrastra imágenes JPG / PNG aquí</p>
        </div>
      </div>
      <div class="panel-footer">
        <button id="btnAddImages">+ Añadir imágenes</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple hidden>

  <script type="module">
    // Tasks 2+ aquí

    // ── Task 3: State ────────────────────────────────────────────────
    const state = {
      slides: [],
      config: {
        aspectRatio: '16:9', customW: 1920, customH: 1080,
        resolution: '1080p', fitMode: 'contain',
        bgBlur: 0, bgColor: '#000000', bgImageId: null, bgImageBlur: 0,
        slideDuration: 3.0, transitionDuration: 0.5,
        transition: 'fade',
        fps: 30, quality: 'medium', filename: 'sequentia',
        loop: false,
        watermark: null, frame: null, vignette: 0, vignetteColor: '#000000',
        globalText: null,
        audio: null,
      },
      currentIndex: 0,
      playing: false,
    };

    // ── Task 2: IndexedDB Storage Layer ─────────────────────────────

    async function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('sequentia-db', 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('project')) db.createObjectStore('project', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('images'))  db.createObjectStore('images',  { keyPath: 'id' });
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function dbGet(store, key) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    }

    async function dbPut(store, value) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(value);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    }

    async function dbDelete(store, key) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(key);
        req.onsuccess = () => res();
        req.onerror   = () => rej(req.error);
      });
    }

    async function dbGetAll(store) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    }

    function serializeState(state) {
      return {
        id: 'main',
        slides: state.slides.map(s => ({
          id: s.id,
          name: s.name,
          width: s.width,
          height: s.height,
          // blobUrl excluido — se regenera al cargar
          overrides: s.overrides ?? {},
        })),
        config: state.config,
        currentIndex: state.currentIndex,
      };
    }

    async function saveProject(state) {
      await dbPut('project', serializeState(state));
    }

    async function loadProject() {
      return await dbGet('project', 'main');
    }

    // ── Task 3: Toast ────────────────────────────────────────────────

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-out');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, 3000);
    }

    // ── Task 3: Image Functions ──────────────────────────────────────

    async function addImages(files) {
      const valid = [...files]
        .filter(f => {
          const ok = ['image/jpeg', 'image/png'].includes(f.type);
          if (!ok) showToast('Formato no soportado: ' + f.name.split('.').pop().toUpperCase(), 'error');
          return ok;
        })
        .sort((a, b) => a.name.localeCompare(b.name));

      for (const file of valid) {
        const blob = file;
        const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
        const id = crypto.randomUUID();
        const slide = {
          id,
          name: file.name,
          width: bitmap.width,
          height: bitmap.height,
          blobUrl: URL.createObjectURL(blob),
          overrides: {},
        };
        slide._bitmap = bitmap; // guardar para dibujo
        await dbPut('images', { id, blob, name: file.name, width: slide.width, height: slide.height });
        state.slides.push(slide);
      }

      renderThumbs();
      updateCanvasSize();
      renderFrame();
      await saveProject(state);
    }

    function removeSlide(id) {
      const idx = state.slides.findIndex(s => s.id === id);
      if (idx === -1) return;
      const slide = state.slides[idx];
      URL.revokeObjectURL(slide.blobUrl);
      if (slide._bitmap) { slide._bitmap.close(); delete slide._bitmap; }
      dbDelete('images', id);
      state.slides.splice(idx, 1);
      if (state.currentIndex >= state.slides.length) {
        state.currentIndex = Math.max(0, state.slides.length - 1);
      }
      renderThumbs();
      saveProject(state);
    }

    // ── Task 3: renderThumbs ─────────────────────────────────────────

    function getCanvasRes() {
      return state.config.resolution === '720p' ? { w: 1280, h: 720 } : { w: 1920, h: 1080 };
    }

    function renderThumbs() {
      const list = document.getElementById('thumbList');
      const empty = document.getElementById('emptyState');

      const ratios = { '16:9': '16/9', '9:16': '9/16', '1:1': '1/1', '4:3': '4/3', '4:5': '4/5', '21:9': '21/9' };
      document.documentElement.style.setProperty('--canvas-ratio', ratios[state.config.aspectRatio] || '16/9');

      if (state.slides.length === 0) {
        list.innerHTML = '';
        list.appendChild(empty);
        updateEmptyState();
        updatePlayControls();
        return;
      }

      empty.remove();

      const res = getCanvasRes();

      list.innerHTML = '';
      state.slides.forEach((slide, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb' + (i === state.currentIndex ? ' selected' : '');
        thumb.dataset.id = slide.id;
        thumb.draggable = true;

        const img = document.createElement('img');
        img.src = slide.blobUrl;
        img.loading = 'lazy';

        const num = document.createElement('span');
        num.className = 'thumb-num';
        num.textContent = i + 1;

        const del = document.createElement('button');
        del.className = 'thumb-delete';
        del.textContent = '×';
        del.title = 'Eliminar';

        thumb.appendChild(img);
        thumb.appendChild(num);

        if (slide.width < res.w || slide.height < res.h) {
          const badge = document.createElement('span');
          badge.className = 'thumb-badge';
          badge.textContent = '!';
          badge.title = `Resolución baja: ${slide.width}×${slide.height} < ${res.w}×${res.h}`;
          thumb.appendChild(badge);
        }

        thumb.appendChild(del);
        list.appendChild(thumb);

        thumb.addEventListener('click', e => {
          if (e.target === del) return;
          state.currentIndex = i;
          renderThumbs();
        });

        del.addEventListener('click', e => {
          e.stopPropagation();
          const ov = slide.overrides;
          const items = [
            ov.duration && `duración (${ov.duration}s)`,
            ov.transition && `transición (${ov.transition})`,
            ov.textMode === 'own' && 'texto propio',
          ].filter(Boolean);
          if (items.length === 0 || confirm(`Este slide tiene: ${items.join(', ')}. ¿Eliminar de todas formas?`)) {
            removeSlide(slide.id);
          }
        });

        thumb.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', slide.id);
          e.dataTransfer.effectAllowed = 'move';
        });
        thumb.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.thumb.drag-over').forEach(el => el.classList.remove('drag-over'));
          thumb.classList.add('drag-over');
        });
        thumb.addEventListener('dragleave', () => thumb.classList.remove('drag-over'));
        thumb.addEventListener('drop', e => {
          e.preventDefault();
          thumb.classList.remove('drag-over');
          const fromId = e.dataTransfer.getData('text/plain');
          const fromIdx = state.slides.findIndex(s => s.id === fromId);
          const toIdx = i;
          if (fromIdx === -1 || fromIdx === toIdx) return;
          const [moved] = state.slides.splice(fromIdx, 1);
          state.slides.splice(toIdx, 0, moved);
          renderThumbs();
          saveProject(state);
        });

        thumb.addEventListener('contextmenu', e => {
          e.preventDefault();
          showContextMenu(e.clientX, e.clientY, slide);
        });
      });

      updateEmptyState();
      updatePlayControls();
    }

    // ── Task 3: Context Menu ─────────────────────────────────────────

    function showContextMenu(x, y, slide) {
      let menu = document.getElementById('contextMenu');
      if (menu) menu.remove();
      menu = document.createElement('div');
      menu.id = 'contextMenu';

      const replaceBtn = document.createElement('button');
      replaceBtn.textContent = 'Reemplazar imagen';
      replaceBtn.addEventListener('click', () => {
        menu.remove();
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/jpeg,image/png';
        input.addEventListener('change', async () => {
          if (!input.files[0]) return;
          const file = input.files[0];
          if (!['image/jpeg', 'image/png'].includes(file.type)) {
            showToast('Formato no soportado: ' + file.name.split('.').pop().toUpperCase(), 'error');
            return;
          }
          const blob = file;
          const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
          URL.revokeObjectURL(slide.blobUrl);
          slide.blobUrl = URL.createObjectURL(blob);
          slide.name = file.name;
          slide.width = bitmap.width;
          slide.height = bitmap.height;
          bitmap.close();
          await dbPut('images', { id: slide.id, blob, name: file.name, width: slide.width, height: slide.height });
          renderThumbs();
          await saveProject(state);
        });
        input.click();
      });

      menu.appendChild(replaceBtn);
      document.body.appendChild(menu);
      menu.style.left = Math.min(x, window.innerWidth - 170) + 'px';
      menu.style.top = Math.min(y, window.innerHeight - 60) + 'px';
      document.addEventListener('click', () => menu.remove(), { once: true });
    }

    // ── Task 4: Canvas Preview Engine ───────────────────────────────

    function getCanvasDimensions() {
      const h = state.config.resolution === '720p' ? 720 : 1080;
      const ratios = { '16:9': 16/9, '9:16': 9/16, '1:1': 1, '4:3': 4/3, '4:5': 4/5, '21:9': 21/9 };
      let ratio;
      if (state.config.aspectRatio === 'custom') {
        ratio = state.config.customW / state.config.customH;
      } else {
        ratio = ratios[state.config.aspectRatio] ?? (16/9);
      }
      const w = Math.round(h * ratio / 2) * 2; // par
      return { w, h };
    }

    function updateCanvasSize() {
      const canvas = document.getElementById('previewCanvas');
      const wrap = document.getElementById('previewWrap');
      const info = document.getElementById('canvasInfo');
      const { w, h } = getCanvasDimensions();

      canvas.width = w;
      canvas.height = h;

      // Calcular tamaño visual del wrap para caber en el área disponible
      const area = document.getElementById('previewArea');
      const maxW = area.clientWidth - 32;
      const maxH = Math.min(area.clientHeight || 600, window.innerHeight * 0.55);
      const scale = Math.min(maxW / w, maxH / h, 1);
      const displayW = Math.round(w * scale);
      const displayH = Math.round(h * scale);

      wrap.style.width = displayW + 'px';
      wrap.style.height = displayH + 'px';

      // Actualizar CSS ratio para thumbnails
      const ratioLabel = state.config.aspectRatio === 'custom'
        ? `${state.config.customW}:${state.config.customH}`
        : state.config.aspectRatio;
      const cssRatio = w + '/' + h;
      document.documentElement.style.setProperty('--canvas-ratio', cssRatio);

      if (info) info.textContent = `${ratioLabel} · ${state.config.resolution}`;
    }

    function calcFit(imgW, imgH, canvasW, canvasH, mode) {
      const imgRatio = imgW / imgH;
      const canRatio = canvasW / canvasH;
      let dw, dh;
      if (mode === 'cover') {
        dw = imgRatio > canRatio ? canvasH * imgRatio : canvasW;
        dh = dw / imgRatio;
      } else if (mode === 'fit-width') {
        dw = canvasW;
        dh = dw / imgRatio;
      } else if (mode === 'fit-height') {
        dh = canvasH;
        dw = dh * imgRatio;
      } else { // contain (default)
        if (imgRatio > canRatio) { dw = canvasW; dh = dw / imgRatio; }
        else { dh = canvasH; dw = dh * imgRatio; }
      }
      return { dx: (canvasW - dw) / 2, dy: (canvasH - dh) / 2, dw, dh };
    }

    async function getImageBitmap(slide) {
      // Intenta usar el blobUrl cacheado; si no, carga desde IndexedDB
      if (slide.blobUrl) {
        const resp = await fetch(slide.blobUrl);
        const blob = await resp.blob();
        return createImageBitmap(blob, { imageOrientation: 'from-image' });
      }
      return null;
    }

    function drawSlide(ctx, slide, t = 0) {
      if (!slide) return;
      const w = ctx.canvas.width;
      const h = ctx.canvas.height;
      const cfg = state.config;

      ctx.clearRect(0, 0, w, h);

      // 1. Fondo base (color)
      ctx.fillStyle = cfg.bgColor || '#000000';
      ctx.fillRect(0, 0, w, h);

      // 2. Fondo con imagen del slide (blur)
      if (slide._bitmap) {
        if (cfg.bgBlur > 0) {
          ctx.save();
          ctx.filter = `blur(${cfg.bgBlur * 0.3}px)`;
          // Cover con padding para evitar bordes cortados
          const padding = 1.1;
          const bw = w * padding, bh = h * padding;
          const bx = (w - bw) / 2, by = (h - bh) / 2;
          // Cover fit
          const fit = calcFit(slide._bitmap.width, slide._bitmap.height, bw, bh, 'cover');
          ctx.drawImage(slide._bitmap, bx + fit.dx, by + fit.dy, fit.dw, fit.dh);
          ctx.filter = 'none';
          ctx.restore();
        } else {
          // Cover sin blur
          const fit = calcFit(slide._bitmap.width, slide._bitmap.height, w, h, 'cover');
          ctx.drawImage(slide._bitmap, fit.dx, fit.dy, fit.dw, fit.dh);
        }
      }

      // 3. Imagen principal (según fitMode)
      if (slide._bitmap) {
        const fit = calcFit(slide._bitmap.width, slide._bitmap.height, w, h, cfg.fitMode || 'contain');
        ctx.drawImage(slide._bitmap, fit.dx, fit.dy, fit.dw, fit.dh);
      }

      // 4. Vignette
      if (cfg.vignette > 0) {
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h) * 0.7);
        grad.addColorStop(0, 'transparent');
        const alpha = Math.round(cfg.vignette * 255).toString(16).padStart(2, '0');
        grad.addColorStop(1, (cfg.vignetteColor || '#000000') + alpha);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }
    }

    function renderFrame(t = 0) {
      const canvas = document.getElementById('previewCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const slide = state.slides[state.currentIndex];
      if (!slide) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      drawSlide(ctx, slide, t);
    }

    function updateEmptyState() {
      const empty = document.getElementById('canvasEmpty');
      if (!empty) return;
      empty.style.display = state.slides.length === 0 ? 'flex' : 'none';
    }

    // ── Task 5: Playback Engine ──────────────────────────────────────

    let _rafId = null;
    let _lastTime = null;
    let _slideElapsed = 0;   // segundos transcurridos en el slide actual
    let _transElapsed = 0;   // segundos en la transición
    let _inTransition = false;
    const TRANSITIONS_LIST = ['fade', 'slide', 'zoom-punch', 'wipe', 'cross-zoom', 'flash'];

    function getEffectiveDuration(slide) {
      return slide?.overrides?.duration ?? state.config.slideDuration;
    }

    function getEffectiveTransition(slide) {
      return slide?.overrides?.transition ?? state.config.transition;
    }

    function goToSlide(index) {
      if (state.slides.length === 0) return;
      const clamped = state.config.loop
        ? ((index % state.slides.length) + state.slides.length) % state.slides.length
        : Math.max(0, Math.min(index, state.slides.length - 1));
      state.currentIndex = clamped;
      _slideElapsed = 0;
      _inTransition = false;
      renderFrame();
      renderThumbs();
      updatePlayControls();
    }

    function updatePlayControls() {
      const empty = state.slides.length === 0;
      const isFirst = state.currentIndex === 0;
      const isLast = state.currentIndex === state.slides.length - 1;

      document.getElementById('btnPlayPause').disabled = empty;
      document.getElementById('btnPrev').disabled = empty || (!state.config.loop && isFirst);
      document.getElementById('btnNext').disabled = empty || (!state.config.loop && isLast);
      document.getElementById('btnFullscreen').disabled = empty;
      document.getElementById('btnExport').disabled = empty;

      const counter = document.getElementById('slideCounter');
      if (empty) { counter.textContent = '– / –'; }
      else { counter.textContent = `${state.currentIndex + 1} / ${state.slides.length}`; }

      const btn = document.getElementById('btnPlayPause');
      btn.textContent = state.playing ? '⏸' : '▶';

      // Indicador en header
      const ind = document.getElementById('indicator');
      if (state.playing) {
        ind.className = 'indicator live';
      } else {
        ind.className = 'indicator';
      }
    }

    function play() {
      if (state.slides.length === 0) return;
      state.playing = true;
      _lastTime = null;
      _rafId = requestAnimationFrame(_tick);
      updatePlayControls();
    }

    function pause() {
      state.playing = false;
      if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
      _lastTime = null;
      updatePlayControls();
    }

    function _tick(now) {
      if (!state.playing) return;

      if (_lastTime === null) _lastTime = now;
      const delta = (now - _lastTime) / 1000; // segundos
      _lastTime = now;

      const slide = state.slides[state.currentIndex];
      const transDur = slide?.overrides?.transitionDuration ?? state.config.transitionDuration;
      const slideDur = getEffectiveDuration(slide);

      if (_inTransition) {
        _transElapsed += delta;
        const t = Math.min(_transElapsed / transDur, 1);
        const nextSlide = state.slides[state.currentIndex + 1] ?? state.slides[0];
        // drawTransition se implementa en Task 6; por ahora renderFrame
        if (typeof drawTransition === 'function') {
          const canvas = document.getElementById('previewCanvas');
          const ctx = canvas.getContext('2d');
          drawTransition(ctx, slide, nextSlide, t, canvas.width, canvas.height);
        } else {
          renderFrame(t);
        }
        if (_transElapsed >= transDur) {
          _inTransition = false;
          _transElapsed = 0;
          _slideElapsed = 0;
          // Avanzar slide
          const nextIdx = state.currentIndex + 1;
          if (nextIdx >= state.slides.length) {
            if (state.config.loop) {
              state.currentIndex = 0;
            } else {
              pause();
              return;
            }
          } else {
            state.currentIndex = nextIdx;
          }
          renderThumbs();
          updatePlayControls();
        }
      } else {
        _slideElapsed += delta;
        const t = Math.min(_slideElapsed / slideDur, 1);
        renderFrame(t);
        if (_slideElapsed >= slideDur) {
          // Pasar a transición si hay siguiente slide
          const hasNext = state.currentIndex < state.slides.length - 1 || state.config.loop;
          if (hasNext && transDur > 0) {
            _inTransition = true;
            _transElapsed = 0;
          } else if (hasNext && transDur === 0) {
            // Sin transición — saltar directamente
            _slideElapsed = 0;
            const nextIdx = state.currentIndex + 1;
            if (nextIdx >= state.slides.length) {
              if (state.config.loop) { state.currentIndex = 0; }
              else { pause(); return; }
            } else {
              state.currentIndex = nextIdx;
            }
            renderThumbs();
            updatePlayControls();
          } else {
            pause();
            return;
          }
        }
      }

      _rafId = requestAnimationFrame(_tick);
    }

    function cycleTransition() {
      const cur = state.config.transition;
      const idx = TRANSITIONS_LIST.indexOf(cur);
      state.config.transition = TRANSITIONS_LIST[(idx + 1) % TRANSITIONS_LIST.length];
      showToast('Transición: ' + state.config.transition, 'info');
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    }

    // ── Init ─────────────────────────────────────────────────────────

    async function main() {
      // Verificar IndexedDB disponible
      if (!window.indexedDB) {
        console.error('IndexedDB no disponible');
        return;
      }

      // Task 4: Inicializar canvas
      updateCanvasSize();
      updateEmptyState();

      // Task 4: Reajustar canvas al cambiar ventana
      window.addEventListener('resize', () => {
        updateCanvasSize();
        renderFrame();
      });

      // Task 3: Event listeners — image loading
      document.getElementById('btnAddImages').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });
      document.getElementById('fileInput').addEventListener('change', e => {
        if (e.target.files.length > 0) addImages(e.target.files);
        e.target.value = '';
      });

      ['thumbList', 'panelCenter'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('dragover', e => {
          if (e.dataTransfer.types.includes('Files')) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
          }
        });
        el.addEventListener('drop', e => {
          if (e.dataTransfer.files.length > 0) {
            e.preventDefault();
            addImages(e.dataTransfer.files);
          }
        });
      });

      // Task 5: Controles de reproducción
      document.getElementById('btnPlayPause').addEventListener('click', () => {
        state.playing ? pause() : play();
      });
      document.getElementById('btnPrev').addEventListener('click', () => goToSlide(state.currentIndex - 1));
      document.getElementById('btnNext').addEventListener('click', () => goToSlide(state.currentIndex + 1));
      document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

      // Task 5: Loop checkboxes sincronizados
      ['chkLoop', 'chkLoopCtrl'].forEach(id => {
        document.getElementById(id).addEventListener('change', e => {
          state.config.loop = e.target.checked;
          // Sincronizar el otro checkbox
          ['chkLoop', 'chkLoopCtrl'].forEach(oid => {
            if (oid !== id) document.getElementById(oid).checked = e.target.checked;
          });
          updatePlayControls();
          saveProject(state);
        });
      });

      // Task 5: Atajos de teclado
      document.addEventListener('keydown', e => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        const map = {
          ArrowLeft:  () => goToSlide(state.currentIndex - 1),
          ArrowRight: () => goToSlide(state.currentIndex + 1),
          ' ':        () => state.playing ? pause() : play(),
          'f':        () => toggleFullscreen(),
          'F':        () => toggleFullscreen(),
          'Escape':   () => { if (document.fullscreenElement) document.exitFullscreen(); },
          'r':        () => { goToSlide(0); play(); },
          'R':        () => { goToSlide(0); play(); },
          'm':        () => { const a = document.querySelector('audio'); if (a) a.muted = !a.muted; },
          'M':        () => { const a = document.querySelector('audio'); if (a) a.muted = !a.muted; },
          't':        () => cycleTransition(),
          'T':        () => cycleTransition(),
        };
        if (map[e.key]) { e.preventDefault(); map[e.key](); }
      });

      // Task 5: Inicializar controles
      updatePlayControls();
    }

    main();
  </script>

</body>
