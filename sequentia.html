<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequentia</title>
  <!-- Google Fonts: IBM Plex Mono (400,500), IBM Plex Sans (400,500,600), Inter, Playfair Display, Montserrat, Oswald, Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;700&family=Oswald:wght@400;500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens ──────────────────────────────────────────── */
    :root {
      --bg:      #09090b;
      --s1:      #111113;
      --s2:      #18181b;
      --s3:      #27272a;
      --border:  #2e2e32;
      --text:    #fafafa;
      --muted:   #71717a;
      --accent:  #f97316;
      --accent2: #fb923c;
      --green:   #22c55e;
      --red:     #ef4444;
      --mono:    'IBM Plex Mono', monospace;
      --sans:    'IBM Plex Sans', system-ui, sans-serif;
    }

    /* ── Reset ──────────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: grid;
      grid-template-rows: 52px 1fr;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      font-family: var(--sans);
      color: var(--text);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .header-center {
      display: flex;
      align-items: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn-export {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
      transition: background 0.15s;
    }

    .btn-export:hover {
      background: var(--accent2);
    }

    .btn-export.exporting {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      min-width: 140px;
    }

    .export-progress-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: rgba(249, 115, 22, 0.3);
      transition: width 0.2s;
      pointer-events: none;
    }

    #exportProgressLabel {
      position: relative;
      z-index: 1;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--sans);
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* ── Toggle ──────────────────────────────────────────────────── */
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
    }

    .toggle input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ── Indicator ───────────────────────────────────────────────── */
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* ── Layout ──────────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: 100%;
      overflow: hidden;
    }

    #panelCenter {
      background: var(--bg);
    }

    #panelRight {
      background: var(--s2);
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    #panelCenter::-webkit-scrollbar,
    #panelRight::-webkit-scrollbar {
      width: 4px;
    }

    #panelCenter::-webkit-scrollbar-track,
    #panelRight::-webkit-scrollbar-track {
      background: transparent;
    }

    #panelCenter::-webkit-scrollbar-thumb,
    #panelRight::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    #panelCenter::-webkit-scrollbar-thumb:hover,
    #panelRight::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ── Toast System ────────────────────────────────────────────── */
    #toastContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--sans);
      color: var(--text);
      background: var(--s3);
      border: 1px solid var(--border);
      max-width: 320px;
      pointer-events: auto;
      animation: toastIn 0.2s ease forwards;
    }

    .toast.toast-out {
      animation: toastOut 0.2s ease forwards;
    }

    .toast-success {
      border-color: var(--green);
      background: color-mix(in srgb, var(--green) 12%, var(--s3));
    }

    .toast-error {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, var(--s3));
    }

    .toast-info {
      border-color: var(--border);
      background: var(--s3);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }

    /* Thumbnail panel */
    #panelRight { display: flex; flex-direction: column; }
    #thumbList { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    #emptyState { display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 12px; padding: 40px 16px; color: var(--muted); text-align: center; font-size: 13px; }
    .panel-footer { padding: 10px 8px; border-top: 1px solid var(--border); }
    #btnAddImages { width: 100%; padding: 8px; background: var(--s3); color: var(--text);
                    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px;
                    font-family: var(--sans); }
    #btnAddImages:hover { background: var(--accent); border-color: var(--accent); }

    /* Thumbnails */
    :root { --canvas-ratio: 16/9; }
    .thumb { position: relative; width: 100%; aspect-ratio: var(--canvas-ratio);
             border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer;
             background: var(--s3); }
    .thumb:hover { border-color: var(--border); }
    .thumb.selected { border-color: var(--accent); }
    .thumb.drag-over { border-color: var(--accent2); opacity: 0.6; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-num { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.6);
                 color: var(--text); font-size: 11px; font-family: var(--mono);
                 padding: 2px 5px; border-radius: 3px; line-height: 1; }
    .thumb-delete { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6);
                    color: var(--text); border: none; border-radius: 3px; width: 20px; height: 20px;
                    cursor: pointer; font-size: 14px; line-height: 1; display: none; }
    .thumb:hover .thumb-delete { display: flex; align-items: center; justify-content: center; }
    .thumb-badge { position: absolute; bottom: 4px; right: 4px; background: var(--red);
                   color: white; font-size: 10px; font-family: var(--mono); padding: 1px 4px;
                   border-radius: 3px; font-weight: 700; }

    .thumb-edit {
      position: absolute; bottom: 4px; left: 4px;
      background: rgba(0,0,0,0.6); color: var(--text);
      border: none; border-radius: 3px; width: 20px; height: 20px;
      cursor: pointer; font-size: 12px; line-height: 1; display: none;
    }
    .thumb:hover .thumb-edit { display: flex; align-items: center; justify-content: center; }

    .override-panel {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 12px; margin-bottom: 6px;
      display: none; /* oculto por defecto */
    }
    .override-panel.open { display: block; }

    .ov-row { display: flex; align-items: center; justify-content: space-between;
              gap: 8px; margin-bottom: 8px; font-size: 12px; }
    .ov-row:last-child { margin-bottom: 0; }
    .ov-label { color: var(--muted); flex-shrink: 0; }
    .ov-clear { width: 100%; margin-top: 8px; padding: 6px; background: none;
                border: 1px solid var(--red); color: var(--red); border-radius: 4px;
                cursor: pointer; font-size: 12px; font-family: var(--sans); }
    .ov-clear:hover { background: var(--red); color: white; }

    /* Badge de override en miniatura */
    .thumb-badge-ov { position: absolute; bottom: 4px; right: 28px;
                      background: var(--accent); color: white; font-size: 10px;
                      font-family: var(--mono); padding: 1px 4px; border-radius: 3px; }

    /* Panel central */
    #panelCenter { display: flex; flex-direction: column; overflow: hidden; }
    #previewArea { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; flex-shrink: 0; }
    #previewWrap { position: relative; background: #000; border-radius: 8px; overflow: hidden;
                   display: flex; align-items: center; justify-content: center; }
    #previewCanvas { display: block; }
    #canvasEmpty { position: absolute; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 12px; color: var(--muted); font-size: 14px; inset: 0; }
    #canvasInfo { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.5);
                  color: var(--muted); font-size: 11px; font-family: var(--mono);
                  padding: 3px 6px; border-radius: 3px; pointer-events: none; }
    #configPanels { flex: 1; overflow-y: auto; padding: 0 16px 16px; }

    /* ── Play Controls ───────────────────────────────────────────── */
    #playControls {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0;
      flex-wrap: wrap;
    }
    #playControls button {
      background: var(--s3); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px;
      line-height: 1; transition: background 0.15s;
    }
    #playControls button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
    #playControls button:disabled { opacity: 0.35; cursor: not-allowed; }
    #slideCounter { font-size: 12px; color: var(--muted); margin-left: 4px; }

    /* ── Indicator Live ──────────────────────────────────────────── */
    .indicator.live { background: var(--green); animation: pulse 1.5s infinite; }
    .indicator.recording { background: var(--accent); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Context menu */
    #contextMenu { position: fixed; background: var(--s2); border: 1px solid var(--border);
                   border-radius: 6px; padding: 4px; z-index: 1000; min-width: 160px; }
    #contextMenu button { display: block; width: 100%; padding: 8px 12px; background: none;
                          border: none; color: var(--text); font-size: 13px; font-family: var(--sans);
                          text-align: left; cursor: pointer; border-radius: 4px; }
    #contextMenu button:hover { background: var(--s3); }

    /* Config panels */
    #configPanels { display: flex; flex-direction: column; gap: 1px; }

    .config-section { border-bottom: 1px solid var(--border); }
    .ov-subsection { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
    .section-toggle {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 12px 16px; background: none; border: none;
      color: var(--text); font-size: 13px; font-weight: 500; font-family: var(--sans);
      cursor: pointer; text-align: left;
    }
    .section-toggle:hover { background: var(--s1); }
    .section-toggle .chevron { transition: transform 0.2s; flex-shrink: 0; }
    .config-section.open .chevron { transform: rotate(180deg); }
    .section-body { padding: 0 16px 14px; display: none; }
    .config-section.open .section-body { display: block; }

    /* Controls dentro de secciones */
    .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .cfg-row:last-child { margin-bottom: 0; }
    .cfg-label { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .cfg-value { font-size: 12px; color: var(--text); font-family: var(--mono); }

    /* Pill buttons (aspect ratio, resolution, fps, quality, fit, transition) */
    .pill-group { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill {
      padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: none; color: var(--muted); font-size: 12px; font-family: var(--sans);
      cursor: pointer; transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent2); color: var(--text); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* Range sliders */
    input[type=range] { width: 100%; accent-color: var(--accent); }

    /* Number inputs */
    input[type=number].cfg-input {
      background: var(--s3); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: var(--mono);
      width: 72px;
    }
    input[type=number].cfg-input:focus { outline: none; border-color: var(--accent); }

    /* Text inputs */
    input[type=text].cfg-input {
      background: var(--s3); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: var(--sans);
      width: 100%;
    }
    input[type=text].cfg-input:focus { outline: none; border-color: var(--accent); }

    /* Color picker */
    input[type=color] { border: none; background: none; cursor: pointer; width: 32px; height: 24px; padding: 0; border-radius: 4px; }

    /* Compat indicator */
    .compat-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .compat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Presets */
    .preset-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .preset-item { display: flex; align-items: center; justify-content: space-between;
                   padding: 4px 8px; background: var(--s3); border-radius: 4px; font-size: 12px; }
    .preset-item button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; }
    .preset-item button:hover { color: var(--red); }

    /* Thumbnail de bg image */
    #bgImagePreview { width: 48px; height: 36px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }

    /* Transicion direction selector */
    .dir-select { display: flex; gap: 4px; }
    .transition-opts { margin-top: 8px; }

    /* ── Text Controls ──────────────────────────────────────────────── */
    .text-controls { display: flex; flex-direction: column; gap: 8px; }
    .tc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tc-label { font-size: 12px; color: var(--muted); flex-shrink: 0; min-width: 72px; }
    .tc-input {
      background: var(--s3); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: var(--sans);
      flex: 1; min-width: 0;
    }
    .tc-input:focus { outline: none; border-color: var(--accent); }
    .tc-select {
      background: var(--s3); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 3px 6px; font-size: 12px; font-family: var(--sans);
      flex: 1;
    }
    .tc-select:focus { outline: none; border-color: var(--accent); }
    .tc-range { flex: 1; accent-color: var(--accent); }
    .tc-mono { font-size: 12px; color: var(--text); font-family: var(--mono); flex-shrink: 0; min-width: 32px; text-align: right; }
    .tc-color { border: none; background: none; cursor: pointer; width: 32px; height: 24px; padding: 0; border-radius: 4px; }

    /* Text mode toggle in override panel */
    .text-mode-group { display: flex; gap: 4px; flex-wrap: wrap; }

    /* Drag cursor when hovering text overlay on canvas */
    #previewCanvas.text-drag { cursor: move; }

    /* Audio section */
    .audio-drop {
      border: 2px dashed var(--border); border-radius: 6px;
      padding: 18px 12px; text-align: center;
      color: var(--muted); font-size: 12px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      margin-bottom: 6px; user-select: none;
    }
    .audio-drop:hover, .audio-drop.drag-over {
      border-color: var(--accent); color: var(--accent);
    }
    #audioControls { display: none; }
    .audio-name {
      font-size: 12px; color: var(--text); font-family: var(--mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    #audioSeek { width: 100%; margin-bottom: 8px; }
    .audio-trim {
      display: flex; gap: 8px; margin-bottom: 8px;
    }
    .audio-trim label {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--muted); flex: 1;
    }
    .audio-trim input[type=number] {
      width: 60px; font-size: 12px; padding: 3px 5px;
      background: var(--s3); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px;
    }
    .audio-fade-row {
      display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .audio-fade-row label {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--muted); flex: 1;
    }
    .audio-fade-row input[type=number] {
      width: 50px; font-size: 12px; padding: 3px 5px;
      background: var(--s3); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="logo">
      <span class="logo-dot"></span>
      Sequentia
    </div>
    <div class="header-center">
      <button id="btnExport" class="btn-export">Exportar Video</button>
    </div>
    <div class="header-right">
      <span id="indicator" class="indicator"></span>
      <label class="toggle"><input type="checkbox" id="chkLoop"> Loop</label>
      <button id="btnExportJSON" class="btn-ghost">Export JSON</button>
      <button id="btnImportJSON" class="btn-ghost">Import JSON</button>
    </div>
  </header>

  <div id="app">
    <div id="panelCenter">
      <div id="previewArea">
        <div id="previewWrap">
          <canvas id="previewCanvas"></canvas>
          <div id="canvasEmpty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>Carga imágenes para comenzar</p>
          </div>
          <div id="canvasInfo"><!-- se actualiza con ratio y resolución --></div>
        </div>
        <div id="playControls">
          <button id="btnPrev" title="Anterior (←)">⏮</button>
          <button id="btnPlayPause" title="Play/Pause (Espacio)">▶</button>
          <button id="btnNext" title="Siguiente (→)">⏭</button>
          <button id="btnFullscreen" title="Pantalla completa (F)">⛶</button>
          <label class="toggle" title="Loop (L)">
            <input type="checkbox" id="chkLoopCtrl"> Loop
          </label>
          <span id="slideCounter" class="mono">– / –</span>
        </div>
      </div>
      <div id="configPanels"><!-- Task 7 --></div>
    </div>
    <div id="panelRight">
      <div id="thumbList">
        <div id="emptyState">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>Arrastra imágenes JPG / PNG aquí</p>
        </div>
      </div>
      <div class="panel-footer">
        <button id="btnAddImages">+ Añadir imágenes</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple hidden>

  <script type="module">
    // Tasks 2+ aquí

    // ── Task 3: State ────────────────────────────────────────────────
    const state = {
      slides: [],
      config: {
        aspectRatio: '16:9', customW: 1920, customH: 1080,
        resolution: '1080p', fitMode: 'contain',
        bgBlur: 0, bgColor: '#000000', bgImageId: null, bgImageBlur: 0,
        slideDuration: 3.0, transitionDuration: 0.5,
        transition: 'fade',
        fps: 30, quality: 'medium', filename: 'sequentia',
        loop: false,
        watermark: null, frame: null, vignette: 0, vignetteColor: '#000000',
        globalText: { title: '', subtitle: '', font: 'Inter', size: 48, color: '#ffffff', opacity: 1.0, position: { x: 0.5, y: 0.85 }, bgStyle: 'none', bgOpacity: 0.5, animation: 'none', visibleDuration: null },
        audio: {
          id: null, blobUrl: null, name: null, duration: null,
          trimIn: 0, trimOut: null,
          volume: 1.0,
          fadeIn: false, fadeInDuration: 1.0,
          fadeOut: false, fadeOutDuration: 1.5,
          loop: true, muted: false,
        },
      },
      currentIndex: 0,
      playing: false,
    };

    // ── Task 2: IndexedDB Storage Layer ─────────────────────────────

    async function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('sequentia-db', 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('project')) db.createObjectStore('project', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('images'))  db.createObjectStore('images',  { keyPath: 'id' });
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function dbGet(store, key) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    }

    async function dbPut(store, value) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(value);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    }

    async function dbDelete(store, key) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(key);
        req.onsuccess = () => res();
        req.onerror   = () => rej(req.error);
      });
    }

    async function dbGetAll(store) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    }

    function serializeState(state) {
      return {
        id: 'main',
        slides: state.slides.map(s => ({
          id: s.id,
          name: s.name,
          width: s.width,
          height: s.height,
          // blobUrl excluido — se regenera al cargar
          overrides: s.overrides ?? {},
        })),
        config: {
          ...state.config,
          watermark: state.config.watermark ? {
            id: state.config.watermark.id,
            x: state.config.watermark.x,
            y: state.config.watermark.y,
            scale: state.config.watermark.scale,
            opacity: state.config.watermark.opacity,
          } : null,
          frame: state.config.frame ? {
            id: state.config.frame.id,
            opacity: state.config.frame.opacity,
          } : null,
          audio: state.config.audio ? {
            id:              state.config.audio.id,
            name:            state.config.audio.name,
            duration:        state.config.audio.duration,
            trimIn:          state.config.audio.trimIn,
            trimOut:         state.config.audio.trimOut,
            volume:          state.config.audio.volume,
            fadeIn:          state.config.audio.fadeIn,
            fadeInDuration:  state.config.audio.fadeInDuration,
            fadeOut:         state.config.audio.fadeOut,
            fadeOutDuration: state.config.audio.fadeOutDuration,
            loop:            state.config.audio.loop,
            muted:           state.config.audio.muted,
          } : null,
        },
        currentIndex: state.currentIndex,
      };
    }

    async function saveProject(state) {
      await dbPut('project', serializeState(state));
    }

    async function loadProject() {
      return await dbGet('project', 'main');
    }

    // ── Task 13: Autosave con debounce ───────────────────────────────

    let _saveTimer = null;
    function debouncedSave() {
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(() => saveProject(state), 500);
    }

    // ── Task 13: Restaurar proyecto desde IndexedDB ──────────────────

    async function loadAndRestoreProject() {
      const saved = await loadProject();
      if (!saved) return false;

      // Restaurar config con deep merge para campos opcionales
      state.config = {
        ...state.config,
        ...saved.config,
        audio:      saved.config.audio      ?? state.config.audio      ?? null,
        watermark:  saved.config.watermark  ?? state.config.watermark  ?? null,
        frame:      saved.config.frame      ?? state.config.frame      ?? null,
        globalText: saved.config.globalText ?? state.config.globalText ?? null,
      };

      // Restaurar slides
      state.slides = [];
      for (const slide of (saved.slides || [])) {
        const rec = await dbGet('images', slide.id);
        if (rec?.blob) {
          const blobUrl = URL.createObjectURL(rec.blob);
          const _bitmap = await createImageBitmap(rec.blob, { imageOrientation: 'from-image' });
          state.slides.push({ ...slide, blobUrl, _bitmap });
        } else {
          state.slides.push({ ...slide, blobUrl: null, _bitmap: null, _missing: true });
        }
      }

      // Restaurar índice
      state.currentIndex = Math.min(saved.currentIndex ?? 0, Math.max(0, state.slides.length - 1));

      // Restaurar overlays y audio
      await restoreOverlayImages();
      await restoreAudioBlob();

      // Actualizar UI
      updateCanvasSize();
      renderThumbs();
      renderFrame();
      updatePlayControls();
      updateExportEstimate();
      return true;
    }

    // ── Task 13: Restaurar estado desde JSON exportado ───────────────

    async function deserializeState(data) {
      state.config = {
        ...state.config,
        ...data.config,
        audio:      data.config.audio      ?? state.config.audio      ?? null,
        watermark:  data.config.watermark  ?? state.config.watermark  ?? null,
        frame:      data.config.frame      ?? state.config.frame      ?? null,
        globalText: data.config.globalText ?? state.config.globalText ?? null,
      };

      state.slides = [];
      for (const slide of (data.slides || [])) {
        const rec = await dbGet('images', slide.id);
        if (rec?.blob) {
          const blobUrl = URL.createObjectURL(rec.blob);
          const _bitmap = await createImageBitmap(rec.blob, { imageOrientation: 'from-image' });
          state.slides.push({ ...slide, blobUrl, _bitmap });
        } else {
          state.slides.push({ ...slide, blobUrl: null, _bitmap: null, _missing: true });
        }
      }

      state.currentIndex = Math.min(data.currentIndex ?? 0, Math.max(0, state.slides.length - 1));

      await restoreOverlayImages();
      await restoreAudioBlob();

      updateCanvasSize();
      renderThumbs();
      renderFrame();
      updatePlayControls();
      updateExportEstimate();
    }

    // ── Task 3: Toast ────────────────────────────────────────────────

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-out');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, 3000);
    }

    // ── Task 3: Image Functions ──────────────────────────────────────

    async function addImages(files) {
      const valid = [...files]
        .filter(f => {
          const ok = ['image/jpeg', 'image/png'].includes(f.type);
          if (!ok) showToast('Formato no soportado: ' + f.name.split('.').pop().toUpperCase(), 'error');
          return ok;
        })
        .sort((a, b) => a.name.localeCompare(b.name));

      for (const file of valid) {
        const blob = file;
        const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
        const id = crypto.randomUUID();
        const slide = {
          id,
          name: file.name,
          width: bitmap.width,
          height: bitmap.height,
          blobUrl: URL.createObjectURL(blob),
          overrides: {},
        };
        slide._bitmap = bitmap; // guardar para dibujo
        await dbPut('images', { id, blob, name: file.name, width: slide.width, height: slide.height });
        state.slides.push(slide);
      }

      renderThumbs();
      updateCanvasSize();
      renderFrame();
      debouncedSave();
      updateExportEstimate();
    }

    function removeSlide(id) {
      const idx = state.slides.findIndex(s => s.id === id);
      if (idx === -1) return;
      const slide = state.slides[idx];
      URL.revokeObjectURL(slide.blobUrl);
      if (slide._bitmap) { slide._bitmap.close(); delete slide._bitmap; }
      dbDelete('images', id);
      state.slides.splice(idx, 1);
      if (state.currentIndex >= state.slides.length) {
        state.currentIndex = Math.max(0, state.slides.length - 1);
      }
      renderThumbs();
      debouncedSave();
    }

    // ── Task 3: renderThumbs ─────────────────────────────────────────

    function getCanvasRes() {
      return state.config.resolution === '720p' ? { w: 1280, h: 720 } : { w: 1920, h: 1080 };
    }

    function renderThumbs() {
      const list = document.getElementById('thumbList');
      const empty = document.getElementById('emptyState');

      const ratios = { '16:9': '16/9', '9:16': '9/16', '1:1': '1/1', '4:3': '4/3', '4:5': '4/5', '21:9': '21/9' };
      document.documentElement.style.setProperty('--canvas-ratio', ratios[state.config.aspectRatio] || '16/9');

      if (state.slides.length === 0) {
        list.innerHTML = '';
        list.appendChild(empty);
        updateEmptyState();
        updatePlayControls();
        return;
      }

      empty.remove();

      const res = getCanvasRes();

      list.innerHTML = '';
      state.slides.forEach((slide, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb' + (i === state.currentIndex ? ' selected' : '');
        thumb.dataset.id = slide.id;
        thumb.draggable = true;

        let imgEl;
        if (slide._missing) {
          // Placeholder para imágenes no disponibles
          const canvas = document.createElement('canvas');
          canvas.width = 160;
          canvas.height = 90;
          const ctx2 = canvas.getContext('2d');
          ctx2.fillStyle = '#1a1a1e';
          ctx2.fillRect(0, 0, 160, 90);
          ctx2.fillStyle = '#f97316';
          ctx2.font = 'bold 28px sans-serif';
          ctx2.textAlign = 'center';
          ctx2.textBaseline = 'middle';
          ctx2.fillText('⚠', 80, 38);
          ctx2.fillStyle = '#71717a';
          ctx2.font = '10px sans-serif';
          const name = (slide.name || '').length > 18 ? (slide.name || '').slice(0, 15) + '…' : (slide.name || '');
          ctx2.fillText(name, 80, 70);
          imgEl = document.createElement('img');
          imgEl.src = canvas.toDataURL();
        } else {
          imgEl = document.createElement('img');
          imgEl.src = slide.blobUrl;
          imgEl.loading = 'lazy';
        }

        const num = document.createElement('span');
        num.className = 'thumb-num';
        num.textContent = i + 1;

        const del = document.createElement('button');
        del.className = 'thumb-delete';
        del.textContent = '×';
        del.title = 'Eliminar';

        thumb.appendChild(imgEl);
        thumb.appendChild(num);

        if (slide.width < res.w || slide.height < res.h) {
          const badge = document.createElement('span');
          badge.className = 'thumb-badge';
          badge.textContent = '!';
          badge.title = `Resolución baja: ${slide.width}×${slide.height} < ${res.w}×${res.h}`;
          thumb.appendChild(badge);
        }

        // Override badge
        const ov = slide.overrides || {};
        const hasOverrides = ov.duration || ov.transition || ov.transitionDuration || (ov.textMode && ov.textMode !== 'inherit');
        if (hasOverrides) {
          const badge = document.createElement('span');
          badge.className = 'thumb-badge-ov';
          badge.textContent = ov.duration ? `${ov.duration}s` : '✎';
          badge.title = 'Este slide tiene overrides';
          thumb.appendChild(badge);
        }

        // Edit button
        const editBtn = document.createElement('button');
        editBtn.className = 'thumb-edit';
        editBtn.textContent = '✎';
        editBtn.title = 'Overrides de este slide';
        editBtn.addEventListener('click', e => {
          e.stopPropagation();
          toggleOverridePanel(slide.id);
        });
        thumb.appendChild(editBtn);

        thumb.appendChild(del);
        list.appendChild(thumb);

        // Override panel (inline, after thumb)
        const overrideEl = buildOverridePanel(slide);
        list.appendChild(overrideEl);

        thumb.addEventListener('click', e => {
          if (e.target === del) return;
          state.currentIndex = i;
          renderThumbs();
        });

        del.addEventListener('click', e => {
          e.stopPropagation();
          const ov = slide.overrides;
          const items = [
            ov.duration && `duración (${ov.duration}s)`,
            ov.transition && `transición (${ov.transition})`,
            ov.textMode === 'own' && 'texto propio',
            ov.textMode === 'none' && 'texto: sin texto',
          ].filter(Boolean);
          if (items.length === 0 || confirm(`Este slide tiene: ${items.join(', ')}. ¿Eliminar de todas formas?`)) {
            removeSlide(slide.id);
          }
        });

        thumb.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', slide.id);
          e.dataTransfer.effectAllowed = 'move';
        });
        thumb.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.thumb.drag-over').forEach(el => el.classList.remove('drag-over'));
          thumb.classList.add('drag-over');
        });
        thumb.addEventListener('dragleave', () => thumb.classList.remove('drag-over'));
        thumb.addEventListener('drop', e => {
          e.preventDefault();
          thumb.classList.remove('drag-over');
          const fromId = e.dataTransfer.getData('text/plain');
          const fromIdx = state.slides.findIndex(s => s.id === fromId);
          const toIdx = i;
          if (fromIdx === -1 || fromIdx === toIdx) return;
          const [moved] = state.slides.splice(fromIdx, 1);
          state.slides.splice(toIdx, 0, moved);
          renderThumbs();
          debouncedSave();
        });

        thumb.addEventListener('contextmenu', e => {
          e.preventDefault();
          showContextMenu(e.clientX, e.clientY, slide);
        });
      });

      // Restaurar panel de override si estaba abierto
      if (_openOverrideId) {
        const panel = document.getElementById('override-' + _openOverrideId);
        if (panel) panel.classList.add('open');
      }

      updateEmptyState();
      updatePlayControls();
    }

    // ── Task 3: Context Menu ─────────────────────────────────────────

    function showContextMenu(x, y, slide) {
      let menu = document.getElementById('contextMenu');
      if (menu) menu.remove();
      menu = document.createElement('div');
      menu.id = 'contextMenu';

      const replaceBtn = document.createElement('button');
      replaceBtn.textContent = 'Reemplazar imagen';
      replaceBtn.addEventListener('click', () => {
        menu.remove();
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/jpeg,image/png';
        input.addEventListener('change', async () => {
          if (!input.files[0]) return;
          const file = input.files[0];
          if (!['image/jpeg', 'image/png'].includes(file.type)) {
            showToast('Formato no soportado: ' + file.name.split('.').pop().toUpperCase(), 'error');
            return;
          }
          const blob = file;
          const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
          URL.revokeObjectURL(slide.blobUrl);
          slide.blobUrl = URL.createObjectURL(blob);
          slide.name = file.name;
          slide.width = bitmap.width;
          slide.height = bitmap.height;
          bitmap.close();
          await dbPut('images', { id: slide.id, blob, name: file.name, width: slide.width, height: slide.height });
          renderThumbs();
          debouncedSave();
        });
        input.click();
      });

      menu.appendChild(replaceBtn);
      document.body.appendChild(menu);
      menu.style.left = Math.min(x, window.innerWidth - 170) + 'px';
      menu.style.top = Math.min(y, window.innerHeight - 60) + 'px';
      document.addEventListener('click', () => menu.remove(), { once: true });
    }

    // ── Task 4: Canvas Preview Engine ───────────────────────────────

    function getCanvasDimensions() {
      const h = state.config.resolution === '720p' ? 720 : 1080;
      const ratios = { '16:9': 16/9, '9:16': 9/16, '1:1': 1, '4:3': 4/3, '4:5': 4/5, '21:9': 21/9 };
      let ratio;
      if (state.config.aspectRatio === 'custom') {
        ratio = state.config.customW / state.config.customH;
      } else {
        ratio = ratios[state.config.aspectRatio] ?? (16/9);
      }
      const w = Math.round(h * ratio / 2) * 2; // par
      return { w, h };
    }

    function updateCanvasSize() {
      const canvas = document.getElementById('previewCanvas');
      const wrap = document.getElementById('previewWrap');
      const info = document.getElementById('canvasInfo');
      const { w, h } = getCanvasDimensions();

      canvas.width = w;
      canvas.height = h;

      // Calcular tamaño visual del wrap para caber en el área disponible
      const area = document.getElementById('previewArea');
      const maxW = area.clientWidth - 32;
      const maxH = Math.min(area.clientHeight || 600, window.innerHeight * 0.55);
      const scale = Math.min(maxW / w, maxH / h, 1);
      const displayW = Math.round(w * scale);
      const displayH = Math.round(h * scale);

      wrap.style.width = displayW + 'px';
      wrap.style.height = displayH + 'px';

      // Actualizar CSS ratio para thumbnails
      const ratioLabel = state.config.aspectRatio === 'custom'
        ? `${state.config.customW}:${state.config.customH}`
        : state.config.aspectRatio;
      const cssRatio = w + '/' + h;
      document.documentElement.style.setProperty('--canvas-ratio', cssRatio);

      if (info) info.textContent = `${ratioLabel} · ${state.config.resolution}`;
    }

    function calcFit(imgW, imgH, canvasW, canvasH, mode) {
      const imgRatio = imgW / imgH;
      const canRatio = canvasW / canvasH;
      let dw, dh;
      if (mode === 'cover') {
        dw = imgRatio > canRatio ? canvasH * imgRatio : canvasW;
        dh = dw / imgRatio;
      } else if (mode === 'fit-width') {
        dw = canvasW;
        dh = dw / imgRatio;
      } else if (mode === 'fit-height') {
        dh = canvasH;
        dw = dh * imgRatio;
      } else { // contain (default)
        if (imgRatio > canRatio) { dw = canvasW; dh = dw / imgRatio; }
        else { dh = canvasH; dw = dh * imgRatio; }
      }
      return { dx: (canvasW - dw) / 2, dy: (canvasH - dh) / 2, dw, dh };
    }

    async function getImageBitmap(slide) {
      // Intenta usar el blobUrl cacheado; si no, carga desde IndexedDB
      if (slide.blobUrl) {
        const resp = await fetch(slide.blobUrl);
        const blob = await resp.blob();
        return createImageBitmap(blob, { imageOrientation: 'from-image' });
      }
      return null;
    }

    function drawSlide(ctx, slide, t = 0) {
      if (!slide) return;
      const w = ctx.canvas.width;
      const h = ctx.canvas.height;
      const cfg = state.config;

      ctx.clearRect(0, 0, w, h);

      // 1. Fondo base (color)
      ctx.fillStyle = cfg.bgColor || '#000000';
      ctx.fillRect(0, 0, w, h);

      // 2. Fondo con imagen del slide (blur)
      if (slide._bitmap) {
        if (cfg.bgBlur > 0) {
          ctx.save();
          ctx.filter = `blur(${cfg.bgBlur * 0.3}px)`;
          // Cover con padding para evitar bordes cortados
          const padding = 1.1;
          const bw = w * padding, bh = h * padding;
          const bx = (w - bw) / 2, by = (h - bh) / 2;
          // Cover fit
          const fit = calcFit(slide._bitmap.width, slide._bitmap.height, bw, bh, 'cover');
          ctx.drawImage(slide._bitmap, bx + fit.dx, by + fit.dy, fit.dw, fit.dh);
          ctx.filter = 'none';
          ctx.restore();
        } else {
          // Cover sin blur
          const fit = calcFit(slide._bitmap.width, slide._bitmap.height, w, h, 'cover');
          ctx.drawImage(slide._bitmap, fit.dx, fit.dy, fit.dw, fit.dh);
        }
      }

      // 3. Imagen principal (según fitMode)
      if (slide._bitmap) {
        const fit = calcFit(slide._bitmap.width, slide._bitmap.height, w, h, cfg.fitMode || 'contain');
        ctx.drawImage(slide._bitmap, fit.dx, fit.dy, fit.dw, fit.dh);
      }

      // 4. Global overlays (frame, watermark, vignette)
      drawGlobalOverlays(ctx, w, h);

      // 5. Text overlay
      const textObj = getEffectiveText(slide);
      const slideDur = getEffectiveDuration(slide);
      if (textObj) drawTextOverlay(ctx, textObj, t, w, h, slideDur);
    }

    // ── Task 10: Global Overlays ─────────────────────────────────────

    function drawGlobalOverlays(ctx, w, h) {
      const { watermark, frame, vignette, vignetteColor } = state.config;
      // Frame — stretched to fill canvas
      if (frame?.img) {
        ctx.globalAlpha = frame.opacity ?? 1;
        ctx.drawImage(frame.img, 0, 0, w, h);
        ctx.globalAlpha = 1;
      }
      // Watermark — centered on normalized x/y
      if (watermark?.img) {
        const ww = w * (watermark.scale ?? 0.2);
        const wh = ww * (watermark.img.height / watermark.img.width);
        ctx.globalAlpha = watermark.opacity ?? 1;
        ctx.drawImage(watermark.img, (watermark.x ?? 0.5) * w - ww / 2, (watermark.y ?? 0.5) * h - wh / 2, ww, wh);
        ctx.globalAlpha = 1;
      }
      // Vignette
      if (vignette > 0) {
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h) * 0.7);
        grad.addColorStop(0, (vignetteColor || '#000000') + '00');
        grad.addColorStop(1, (vignetteColor || '#000000') + Math.round(vignette * 255).toString(16).padStart(2, '0'));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }
    }

    function renderFrame(t = 0) {
      const canvas = document.getElementById('previewCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const slide = state.slides[state.currentIndex];
      if (!slide) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      drawSlide(ctx, slide, t);
    }

    function updateEmptyState() {
      const empty = document.getElementById('canvasEmpty');
      if (!empty) return;
      empty.style.display = state.slides.length === 0 ? 'flex' : 'none';
    }

    // ── Task 5: Playback Engine ──────────────────────────────────────

    let _rafId = null;
    let _webCodecsSupported = typeof VideoEncoder !== 'undefined';
    let _openOverrideId = null; // id del slide cuyo override panel está abierto
    let _lastTime = null;
    let _slideElapsed = 0;   // segundos transcurridos en el slide actual
    let _transElapsed = 0;   // segundos en la transición
    let _inTransition = false;
    const TRANSITIONS_LIST = ['fade', 'slide', 'zoom-punch', 'wipe', 'cross-zoom', 'flash'];

    function getEffectiveDuration(slide) {
      return slide?.overrides?.duration ?? state.config.slideDuration;
    }

    function getEffectiveTransition(slide) {
      if (slide?.overrides?.transition) return slide.overrides.transition;
      const base = state.config.transition;
      if ((base === 'slide' || base === 'wipe') && state.config.transitionDir) {
        return state.config.transitionDir; // ya incluye dirección: 'slide-left', 'wipe-right', etc.
      }
      return base;
    }

    function goToSlide(index) {
      if (state.slides.length === 0) return;
      const clamped = state.config.loop
        ? ((index % state.slides.length) + state.slides.length) % state.slides.length
        : Math.max(0, Math.min(index, state.slides.length - 1));
      state.currentIndex = clamped;
      _slideElapsed = 0;
      _inTransition = false;
      renderFrame();
      renderThumbs();
      updatePlayControls();
    }

    function updatePlayControls() {
      const empty = state.slides.length === 0;
      const isFirst = state.currentIndex === 0;
      const isLast = state.currentIndex === state.slides.length - 1;

      document.getElementById('btnPlayPause').disabled = empty;
      document.getElementById('btnPrev').disabled = empty || (!state.config.loop && isFirst);
      document.getElementById('btnNext').disabled = empty || (!state.config.loop && isLast);
      document.getElementById('btnFullscreen').disabled = empty;
      document.getElementById('btnExport').disabled = empty || !_webCodecsSupported;

      const counter = document.getElementById('slideCounter');
      if (empty) { counter.textContent = '– / –'; }
      else { counter.textContent = `${state.currentIndex + 1} / ${state.slides.length}`; }

      const btn = document.getElementById('btnPlayPause');
      btn.textContent = state.playing ? '⏸' : '▶';

      // Indicador en header
      const ind = document.getElementById('indicator');
      if (state.playing) {
        ind.className = 'indicator live';
      } else {
        ind.className = 'indicator';
      }
    }

    function play() {
      if (state.slides.length === 0) return;
      state.playing = true;
      _lastTime = null;
      _rafId = requestAnimationFrame(_tick);
      updatePlayControls();
      // Audio sync
      const audioEl = document.getElementById('audioEl');
      if (audioEl && state.config.audio?.blobUrl) {
        if (audioEl.paused && audioEl.currentTime <= (state.config.audio.trimIn ?? 0) + 0.1) {
          audioEl.currentTime = state.config.audio.trimIn ?? 0;
        }
        audioEl.play().catch(() => {});
      }
    }

    function pause() {
      state.playing = false;
      if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
      _lastTime = null;
      updatePlayControls();
      // Audio sync
      const audioEl = document.getElementById('audioEl');
      if (audioEl) audioEl.pause();
    }

    function _tick(now) {
      if (!state.playing) return;

      if (_lastTime === null) _lastTime = now;
      const delta = (now - _lastTime) / 1000; // segundos
      _lastTime = now;

      const slide = state.slides[state.currentIndex];
      const transDur = slide?.overrides?.transitionDuration ?? state.config.transitionDuration;
      const slideDur = getEffectiveDuration(slide);

      if (_inTransition) {
        _transElapsed += delta;
        const t = Math.min(_transElapsed / transDur, 1);
        const nextSlide = state.slides[state.currentIndex + 1] ?? state.slides[0];
        // drawTransition se implementa en Task 6; por ahora renderFrame
        if (typeof drawTransition === 'function') {
          const canvas = document.getElementById('previewCanvas');
          const ctx = canvas.getContext('2d');
          drawTransition(ctx, slide, nextSlide, t, canvas.width, canvas.height);
        } else {
          renderFrame(t);
        }
        if (_transElapsed >= transDur) {
          _inTransition = false;
          _transElapsed = 0;
          _slideElapsed = 0;
          // Avanzar slide
          const nextIdx = state.currentIndex + 1;
          if (nextIdx >= state.slides.length) {
            if (state.config.loop) {
              state.currentIndex = 0;
            } else {
              pause();
              return;
            }
          } else {
            state.currentIndex = nextIdx;
          }
          renderThumbs();
          updatePlayControls();
        }
      } else {
        _slideElapsed += delta;
        const t = Math.min(_slideElapsed / slideDur, 1);
        renderFrame(t);
        if (_slideElapsed >= slideDur) {
          // Pasar a transición si hay siguiente slide
          const hasNext = state.currentIndex < state.slides.length - 1 || state.config.loop;
          if (hasNext && transDur > 0) {
            _inTransition = true;
            _transElapsed = 0;
          } else if (hasNext && transDur === 0) {
            // Sin transición — saltar directamente
            _slideElapsed = 0;
            const nextIdx = state.currentIndex + 1;
            if (nextIdx >= state.slides.length) {
              if (state.config.loop) { state.currentIndex = 0; }
              else { pause(); return; }
            } else {
              state.currentIndex = nextIdx;
            }
            renderThumbs();
            updatePlayControls();
          } else {
            pause();
            return;
          }
        }
      }

      _rafId = requestAnimationFrame(_tick);
    }

    function cycleTransition() {
      const cur = state.config.transition;
      const idx = TRANSITIONS_LIST.indexOf(cur);
      state.config.transition = TRANSITIONS_LIST[(idx + 1) % TRANSITIONS_LIST.length];
      showToast('Transición: ' + state.config.transition, 'info');
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    }

    // ── Transitions (Task 6) ─────────────────────────────────────────

    function transitionFade(ctx, slideA, slideB, t, w, h) {
      drawSlide(ctx, slideA, 0);
      const tmp = new OffscreenCanvas(w, h);
      drawSlide(tmp.getContext('2d'), slideB, 0);
      ctx.globalAlpha = t;
      ctx.drawImage(tmp, 0, 0);
      ctx.globalAlpha = 1;
    }

    function transitionSlide(ctx, slideA, slideB, t, w, h, dir = 'left') {
      const dirs = {
        left:  [0, 0, -w * t, 0, w * (1 - t), 0],
        right: [0, 0,  w * t, 0, -w * (1 - t), 0],
        up:    [0, 0, 0, -h * t, 0, h * (1 - t)],
        down:  [0, 0, 0,  h * t, 0, -h * (1 - t)],
      };
      const [,, ax, ay, bx, by] = dirs[dir] || dirs.left;

      const tmpA = new OffscreenCanvas(w, h);
      drawSlide(tmpA.getContext('2d'), slideA, 0);
      const tmpB = new OffscreenCanvas(w, h);
      drawSlide(tmpB.getContext('2d'), slideB, 0);

      ctx.clearRect(0, 0, w, h);
      ctx.save(); ctx.translate(ax, ay); ctx.drawImage(tmpA, 0, 0); ctx.restore();
      ctx.save(); ctx.translate(bx, by); ctx.drawImage(tmpB, 0, 0); ctx.restore();
    }

    function transitionZoomPunch(ctx, slideA, slideB, t, w, h) {
      const tmpA = new OffscreenCanvas(w, h);
      drawSlide(tmpA.getContext('2d'), slideA, 0);
      const tmpB = new OffscreenCanvas(w, h);
      drawSlide(tmpB.getContext('2d'), slideB, 0);

      const scaleA = 1 + t * 0.15;
      ctx.save();
      ctx.translate(w / 2, h / 2); ctx.scale(scaleA, scaleA); ctx.translate(-w / 2, -h / 2);
      ctx.globalAlpha = 1 - t;
      ctx.drawImage(tmpA, 0, 0);
      ctx.restore();

      const scaleB = 1.15 - t * 0.15;
      ctx.save();
      ctx.translate(w / 2, h / 2); ctx.scale(scaleB, scaleB); ctx.translate(-w / 2, -h / 2);
      ctx.globalAlpha = t;
      ctx.drawImage(tmpB, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function transitionWipe(ctx, slideA, slideB, t, w, h, dir = 'left') {
      const tmpA = new OffscreenCanvas(w, h);
      drawSlide(tmpA.getContext('2d'), slideA, 0);
      const tmpB = new OffscreenCanvas(w, h);
      drawSlide(tmpB.getContext('2d'), slideB, 0);

      ctx.drawImage(tmpA, 0, 0);
      ctx.save();
      ctx.beginPath();
      if (dir === 'left')  ctx.rect(0,       0, w * t,       h);
      if (dir === 'right') ctx.rect(w*(1-t), 0, w * t,       h);
      if (dir === 'up')    ctx.rect(0,       0, w,       h * t);
      if (dir === 'down')  ctx.rect(0, h*(1-t), w,       h * t);
      ctx.clip();
      ctx.drawImage(tmpB, 0, 0);
      ctx.restore();
    }

    function transitionCrossZoom(ctx, slideA, slideB, t, w, h, speed = 0.5) {
      const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
      const tmpA = new OffscreenCanvas(w, h);
      drawSlide(tmpA.getContext('2d'), slideA, 0);
      const tmpB = new OffscreenCanvas(w, h);
      drawSlide(tmpB.getContext('2d'), slideB, 0);

      const scaleA = 1 + ease * speed * 2;
      ctx.save();
      ctx.translate(w/2, h/2); ctx.scale(scaleA, scaleA); ctx.translate(-w/2, -h/2);
      ctx.globalAlpha = 1 - ease;
      ctx.drawImage(tmpA, 0, 0);
      ctx.restore();

      const scaleB = 1 + (1 - ease) * speed * 2;
      ctx.save();
      ctx.translate(w/2, h/2); ctx.scale(scaleB, scaleB); ctx.translate(-w/2, -h/2);
      ctx.globalAlpha = ease;
      ctx.drawImage(tmpB, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function transitionFlash(ctx, slideA, slideB, t, w, h, color = '#ffffff') {
      const flashT = t < 0.5 ? t * 2 : (1 - t) * 2;
      const tmp = new OffscreenCanvas(w, h);
      drawSlide(tmp.getContext('2d'), t < 0.5 ? slideA : slideB, 0);
      ctx.drawImage(tmp, 0, 0);
      ctx.fillStyle = color;
      ctx.globalAlpha = flashT;
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
    }

    let _randomTransition = 'fade';

    function pickRandomTransition() {
      const list = TRANSITIONS_LIST;
      return list[Math.floor(Math.random() * list.length)];
    }

    function drawTransition(ctx, slideA, slideB, t, w, h) {
      const cfg = state.config;
      let transition = getEffectiveTransition(slideA);

      if (transition === 'random') {
        if (t < 0.01) _randomTransition = pickRandomTransition();
        transition = _randomTransition;
      }

      const [type, dir] = transition.split('-');
      const speed = cfg.crossZoomSpeed ?? 0.5;
      const flashColor = cfg.flashColor ?? '#ffffff';

      switch (type) {
        case 'fade':   transitionFade(ctx, slideA, slideB, t, w, h); break;
        case 'slide':  transitionSlide(ctx, slideA, slideB, t, w, h, dir || 'left'); break;
        case 'zoom':   transitionZoomPunch(ctx, slideA, slideB, t, w, h); break;
        case 'wipe':   transitionWipe(ctx, slideA, slideB, t, w, h, dir || 'left'); break;
        case 'cross':  transitionCrossZoom(ctx, slideA, slideB, t, w, h, speed); break;
        case 'flash':  transitionFlash(ctx, slideA, slideB, t, w, h, flashColor); break;
        default:       transitionFade(ctx, slideA, slideB, t, w, h); break;
      }
    }

    // ── Task 9: Text Overlay ─────────────────────────────────────────

    function makeDefaultText() {
      return {
        title: '', subtitle: '', font: 'Inter', size: 48,
        color: '#ffffff', opacity: 1.0,
        position: { x: 0.5, y: 0.85 },
        bgStyle: 'none', bgOpacity: 0.5,
        animation: 'none', visibleDuration: null,
      };
    }

    function getEffectiveText(slide) {
      const mode = slide?.overrides?.textMode ?? 'inherit';
      if (mode === 'none') return null;
      if (mode === 'own') return slide.overrides.text ?? null;
      // 'inherit' — use global
      const g = state.config.globalText;
      if (!g || (!g.title && !g.subtitle)) return null;
      return g;
    }

    function drawTextOverlay(ctx, textObj, t, w, h, slideDuration) {
      if (!textObj) return;
      const { title, subtitle, font, size, color, opacity, position, bgStyle, bgOpacity, animation, visibleDuration } = textObj;
      if (!title && !subtitle) return;

      // Visibility check
      const dur = visibleDuration ?? slideDuration;
      if (t * slideDuration > dur) return;

      // Scale font size to current canvas width (design base: 1920px)
      const scaledSize = size * w / 1920;
      const subSize = scaledSize * 0.6;
      const lineGap = scaledSize * 0.15;

      // Animation alpha / offset
      let alpha = opacity;
      let offsetY = 0;
      const FADE_IN = 0.3; // seconds
      const elapsed = t * slideDuration;

      if (animation === 'fade' || animation === 'slideup') {
        if (elapsed < FADE_IN) {
          alpha = opacity * (elapsed / FADE_IN);
        }
        if (animation === 'slideup' && elapsed < FADE_IN) {
          const progress = elapsed / FADE_IN;
          offsetY = (1 - progress) * scaledSize * 1.2;
        }
      }

      // Measure text
      ctx.save();
      ctx.font = `600 ${scaledSize}px ${font}, sans-serif`;
      const titleW = title ? ctx.measureText(title).width : 0;
      ctx.font = `400 ${subSize}px ${font}, sans-serif`;
      const subW = subtitle ? ctx.measureText(subtitle).width : 0;

      const blockW = Math.max(titleW, subW);
      const blockH = (title ? scaledSize : 0) + (subtitle ? subSize + lineGap : 0);

      const cx = position.x * w;
      const cy = position.y * h + offsetY;

      // Draw background
      if (bgStyle !== 'none') {
        const padX = scaledSize * 0.5;
        const padY = scaledSize * 0.25;
        const bgX = cx - blockW / 2 - padX;
        const bgY = cy - scaledSize - padY;
        const bgW = blockW + padX * 2;
        const bgH = blockH + padY * 2;

        ctx.globalAlpha = bgOpacity;
        ctx.fillStyle = '#000000';

        if (bgStyle === 'pill') {
          const r = (bgH / 2);
          ctx.beginPath();
          ctx.roundRect(bgX, bgY, bgW, bgH, r);
          ctx.fill();
        } else if (bgStyle === 'bar') {
          ctx.fillRect(0, bgY, w, bgH);
        }
        ctx.globalAlpha = 1;
      }

      // Draw title
      if (title) {
        ctx.globalAlpha = alpha;
        ctx.font = `600 ${scaledSize}px ${font}, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(title, cx, cy);
      }

      // Draw subtitle below title
      if (subtitle) {
        ctx.globalAlpha = alpha;
        ctx.font = `400 ${subSize}px ${font}, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        const subY = cy + (title ? lineGap + subSize : 0);
        ctx.fillText(subtitle, cx, subY);
      }

      ctx.restore();
    }

    function bindConfigPanelEvents() {

    // ── Task 10: Overlay event bindings ─────────────────────────────

    async function loadOverlayImage(blobUrl) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = blobUrl;
      });
    }

    function bindOverlayEvents() {
      // Watermark upload
      document.getElementById('btnUploadWatermark').addEventListener('click', () => {
        document.getElementById('fileWatermark').click();
      });
      document.getElementById('fileWatermark').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.type !== 'image/png') { showToast('La marca de agua debe ser PNG', 'error'); return; }
        // Revoke old blobUrl if any
        if (state.config.watermark?.blobUrl) URL.revokeObjectURL(state.config.watermark.blobUrl);
        const blobUrl = URL.createObjectURL(file);
        const img = await loadOverlayImage(blobUrl);
        await dbPut('images', { id: 'watermark', blob: file, name: file.name });
        state.config.watermark = { id: 'watermark', blobUrl, img, x: 0.5, y: 0.5, scale: 0.2, opacity: 1.0 };
        document.getElementById('btnRemoveWatermark').style.display = 'inline-flex';
        document.getElementById('rowWmControls').style.display = 'block';
        document.getElementById('sliderWmScale').value = 0.2;
        document.getElementById('lblWmScale').textContent = '20%';
        document.getElementById('sliderWmOpacity').value = 1;
        document.getElementById('lblWmOpacity').textContent = '1.00';
        renderFrame();
        debouncedSave();
        e.target.value = '';
      });

      document.getElementById('btnRemoveWatermark').addEventListener('click', () => {
        if (state.config.watermark?.blobUrl) URL.revokeObjectURL(state.config.watermark.blobUrl);
        dbDelete('images', 'watermark');
        state.config.watermark = null;
        document.getElementById('btnRemoveWatermark').style.display = 'none';
        document.getElementById('rowWmControls').style.display = 'none';
        renderFrame();
        debouncedSave();
      });

      document.getElementById('sliderWmScale').addEventListener('input', e => {
        if (!state.config.watermark) return;
        state.config.watermark.scale = parseFloat(e.target.value);
        document.getElementById('lblWmScale').textContent = Math.round(state.config.watermark.scale * 100) + '%';
        renderFrame();
        debouncedSave();
      });

      document.getElementById('sliderWmOpacity').addEventListener('input', e => {
        if (!state.config.watermark) return;
        state.config.watermark.opacity = parseFloat(e.target.value);
        document.getElementById('lblWmOpacity').textContent = state.config.watermark.opacity.toFixed(2);
        renderFrame();
        debouncedSave();
      });

      // Frame upload
      document.getElementById('btnUploadFrame').addEventListener('click', () => {
        document.getElementById('fileFrame').click();
      });
      document.getElementById('fileFrame').addEventListener('change', async e => {
        const file = e.target.files[0];

        if (file.type !== 'image/png') { showToast('El marco debe ser PNG', 'error'); return; }
        if (state.config.frame?.blobUrl) URL.revokeObjectURL(state.config.frame.blobUrl);
        const blobUrl = URL.createObjectURL(file);
        const img = await loadOverlayImage(blobUrl);
        await dbPut('images', { id: 'frame', blob: file, name: file.name });
        state.config.frame = { id: 'frame', blobUrl, img, opacity: 1.0 };
        document.getElementById('btnRemoveFrame').style.display = 'inline-flex';
        document.getElementById('rowFrameControls').style.display = 'block';
        document.getElementById('sliderFrameOpacity').value = 1;
        document.getElementById('lblFrameOpacity').textContent = '1.00';
        renderFrame();
        debouncedSave();
        e.target.value = '';
      });

      document.getElementById('btnRemoveFrame').addEventListener('click', () => {
        if (state.config.frame?.blobUrl) URL.revokeObjectURL(state.config.frame.blobUrl);
        dbDelete('images', 'frame');
        state.config.frame = null;
        document.getElementById('btnRemoveFrame').style.display = 'none';
        document.getElementById('rowFrameControls').style.display = 'none';
        renderFrame();
        debouncedSave();
      });

      document.getElementById('sliderFrameOpacity').addEventListener('input', e => {
        if (!state.config.frame) return;
        state.config.frame.opacity = parseFloat(e.target.value);

      document.getElementById('sliderVignette').addEventListener('input', e => {

    // Restore watermark and frame img objects from IndexedDB blobs
    async function restoreOverlayImages() {
      // Watermark
      if (state.config.watermark) {
        try {
          const rec = await dbGet('images', 'watermark');
          if (rec?.blob) {
            const blobUrl = URL.createObjectURL(rec.blob);
            const img = await loadOverlayImage(blobUrl);
            state.config.watermark.blobUrl = blobUrl;
            state.config.watermark.img = img;
          } else {
            state.config.watermark = null;
          }
        } catch(err) {
          console.warn('Failed to restore watermark image:', err);
          state.config.watermark = null;
        }
      }
      // Frame
      if (state.config.frame) {
        try {
          const rec = await dbGet('images', 'frame');
          if (rec?.blob) {
            const blobUrl = URL.createObjectURL(rec.blob);
            const img = await loadOverlayImage(blobUrl);
            state.config.frame.blobUrl = blobUrl;
            state.config.frame.img = img;
          } else {
            state.config.frame = null;
          }
        } catch(err) {
          console.warn('Failed to restore frame image:', err);
          state.config.frame = null;
        }
      }
    }

    async function restoreAudioBlob() {
      if (!state.config.audio?.id) return;
      try {
        const rec = await dbGet('images', state.config.audio.id);
        if (rec?.blob) {
          const blobUrl = URL.createObjectURL(rec.blob);
          state.config.audio.blobUrl = blobUrl;
          const audioEl = document.getElementById('audioEl');
          if (audioEl) {
            audioEl.src = blobUrl;
            audioEl.volume = state.config.audio.volume ?? 1;
            audioEl.muted = state.config.audio.muted ?? false;
            audioEl.addEventListener('loadedmetadata', () => {
              state.config.audio.duration = audioEl.duration;
              const seekEl = document.getElementById('audioSeek');
              if (seekEl) seekEl.max = audioEl.duration;
            }, { once: true });
          }
          // Show controls, hide drop zone
          const drop = document.getElementById('audioDrop');
          const ctrl = document.getElementById('audioControls');
          if (drop) drop.style.display = 'none';
          if (ctrl) ctrl.style.display = 'block';
        } else {
          // Blob gone — reset audio state
          state.config.audio.id = null;
          state.config.audio.blobUrl = null;
        }
      } catch(err) {
        console.warn('Failed to restore audio blob:', err);
        state.config.audio.id = null;
        state.config.audio.blobUrl = null;
      }
    }

    function bindAudioEvents() {
      const audioDrop  = document.getElementById('audioDrop');
      const audioInput = document.getElementById('audioInput');
      const audioEl    = document.getElementById('audioEl');

      if (!audioDrop || !audioInput || !audioEl) return;

      // Click drop zone → open file picker
      audioDrop.addEventListener('click', () => audioInput.click());

      // Drag-over styling
      audioDrop.addEventListener('dragover', e => { e.preventDefault(); audioDrop.classList.add('drag-over'); });
      audioDrop.addEventListener('dragleave', () => audioDrop.classList.remove('drag-over'));
      audioDrop.addEventListener('drop', e => {
        e.preventDefault();
        audioDrop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) handleAudioFile(file);
      });

      audioInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) handleAudioFile(file);
        e.target.value = '';
      });

      async function handleAudioFile(file) {
        if (!file.type.startsWith('audio/')) {
          showToast('Formato no soportado. Usa MP3, WAV u OGG.', 'error');
          return;
        }
        // Revoke old blobUrl if any
        if (state.config.audio.blobUrl) URL.revokeObjectURL(state.config.audio.blobUrl);

        const id = 'audio-' + Date.now();
        await dbPut('images', { id, blob: file, name: file.name });

        const blobUrl = URL.createObjectURL(file);
        state.config.audio.id      = id;
        state.config.audio.blobUrl = blobUrl;
        state.config.audio.name    = file.name;
        state.config.audio.trimIn  = 0;
        state.config.audio.trimOut = null;

        // Set up audio element
        audioEl.src    = blobUrl;
        audioEl.volume = state.config.audio.volume ?? 1;
        audioEl.muted  = state.config.audio.muted ?? false;

        // Get duration once metadata loads
        audioEl.addEventListener('loadedmetadata', () => {
          state.config.audio.duration = audioEl.duration;
          document.getElementById('audioSeek').max = audioEl.duration;
          document.getElementById('audioTrimOut').value = '';
          debouncedSave();
        }, { once: true });

        document.getElementById('audioName').textContent = file.name;
        document.getElementById('audioSeek').value = 0;
        document.getElementById('audioTrimIn').value = 0;
        document.getElementById('audioTrimOut').value = '';
        document.getElementById('audioVolume').value = state.config.audio.volume;
        document.getElementById('lblAudioVolume').textContent = state.config.audio.volume.toFixed(2);

        audioDrop.style.display    = 'none';
        document.getElementById('audioControls').style.display = 'block';

        debouncedSave();
        showToast('Audio cargado: ' + file.name);
      }

      // Seek scrubber (preview only)
      document.getElementById('audioSeek').addEventListener('input', e => {
        audioEl.currentTime = parseFloat(e.target.value);
      });

      // Trim In
      document.getElementById('audioTrimIn').addEventListener('change', e => {
        state.config.audio.trimIn = parseFloat(e.target.value) || 0;
        debouncedSave();
      });

      // Trim Out
      document.getElementById('audioTrimOut').addEventListener('change', e => {
        const v = parseFloat(e.target.value);
        state.config.audio.trimOut = isNaN(v) ? null : v;
        debouncedSave();
      });

      // Volume — live update on input, save only on change (avoid IndexedDB writes on every tick)
      document.getElementById('audioVolume').addEventListener('input', e => {
        state.config.audio.volume = parseFloat(e.target.value);
        audioEl.volume = state.config.audio.volume;
        document.getElementById('lblAudioVolume').textContent = state.config.audio.volume.toFixed(2);
      });
      document.getElementById('audioVolume').addEventListener('change', () => {
        debouncedSave();
      });

      // Fade In checkbox + duration
      document.getElementById('audioFadeIn').addEventListener('change', e => {
        state.config.audio.fadeIn = e.target.checked;
        debouncedSave();
      });
      document.getElementById('audioFadeInDur').addEventListener('change', e => {
        state.config.audio.fadeInDuration = parseFloat(e.target.value) || 1.0;
        debouncedSave();
      });

      // Fade Out checkbox + duration
      document.getElementById('audioFadeOut').addEventListener('change', e => {
        state.config.audio.fadeOut = e.target.checked;
        debouncedSave();
      });
      document.getElementById('audioFadeOutDur').addEventListener('change', e => {
        state.config.audio.fadeOutDuration = parseFloat(e.target.value) || 1.5;
        debouncedSave();
      });

      // Remove audio
      document.getElementById('audioRemove').addEventListener('click', () => {
        if (state.config.audio.blobUrl) URL.revokeObjectURL(state.config.audio.blobUrl);
        if (state.config.audio.id) dbDelete('images', state.config.audio.id);
        audioEl.pause();
        audioEl.src = '';
        state.config.audio = {
          id: null, blobUrl: null, name: null, duration: null,
          trimIn: 0, trimOut: null, volume: 1.0,
          fadeIn: false, fadeInDuration: 1.0,
          fadeOut: false, fadeOutDuration: 1.5,
          loop: true, muted: false,
        };
        document.getElementById('audioControls').style.display = 'none';
        audioDrop.style.display = '';
        debouncedSave();
      });

      // Loop on ended
      audioEl.addEventListener('ended', () => {
        if (state.config.audio?.loop && state.playing) {
          audioEl.currentTime = state.config.audio.trimIn ?? 0;
          audioEl.play().catch(() => {});
        }
      });
    }

    function estimateSizeBytes(config, slidesCount) {
      if (slidesCount === 0) return 0;
      const { w, h } = getCanvasDimensions();
      const bitrates = {
        low:    { '720p': 2_000_000, '1080p': 4_000_000 },
        medium: { '720p': 4_000_000, '1080p': 8_000_000 },
        high:   { '720p': 8_000_000, '1080p': 16_000_000 },
      };
      const bitrate = (bitrates[config.quality] || bitrates.medium)[config.resolution] || 8_000_000;
      const totalSecs = slidesCount * config.slideDuration + Math.max(0, slidesCount - 1) * config.transitionDuration;
      return (bitrate / 8) * totalSecs;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function updateExportEstimate() {
      const el = document.getElementById('exportEstimate');
      if (!el) return;
      const bytes = estimateSizeBytes(state.config, state.slides.length);
      el.textContent = bytes > 0 ? formatBytes(bytes) : '–';
    }

          renderFrame(); debouncedSave();
